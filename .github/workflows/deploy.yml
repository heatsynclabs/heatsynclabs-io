name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Kept as a fast pre-build gate even though CI (ci.yml) now runs the same
      # check: it reads package-lock.json, which is what the Dockerfile below
      # installs from.
      #
      # On 2026-08-31 the sibling instance (deveco.io) served 500 on every SSR
      # page after a nuxt bump left three copies of vue in the npm tree, while
      # /api/health kept answering because API routes never touch Vue.
      - name: Single-copy check (the tree this image installs)
        run: node scripts/check-single-vue.mjs

      - name: Build Docker image
        run: docker build -t heatsynclabs-app:latest .

      # Stage the Caddyfile and the script that applies it safely (see
      # deploy/sync-caddyfile.sh) in their own folder, copied in the SAME scp
      # connection as the image: a second connection right after the first was
      # reset by the droplet on the first try (2026-10-14).
      - name: Stage Caddyfile sync files
        run: mkdir -p caddy-sync && cp deploy/Caddyfile deploy/sync-caddyfile.sh deploy/caddyfile-known.sha256 caddy-sync/

      - name: Save image tarball
        run: docker save heatsynclabs-app:latest | gzip > heatsynclabs-app.tar.gz

      # Deploy gate (session 262): nothing reaches the droplet until CI has built
      # and typechecked THIS commit. Skipped for a manual workflow_dispatch run,
      # which is an operator's explicit choice. The image builds in parallel.
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --json status,conclusion --jq '.[0] // {}')
            status=$(echo "$run" | jq -r '.status // "not started"')
            conclusion=$(echo "$run" | jq -r '.conclusion // ""')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then echo "CI passed on $GITHUB_SHA"; exit 0; fi
              echo "::error::CI on $GITHUB_SHA finished '$conclusion'. Not deploying; re-run CI, then re-run this workflow."
              exit 1
            fi
            echo "CI is $status ($i/60)"
            sleep 30
          done
          echo "::error::CI did not finish within 30 minutes. Not deploying."
          exit 1

      - name: Copy image to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          source: heatsynclabs-app.tar.gz,caddy-sync
          target: /opt/commonpub/
          timeout: 600s

      - name: Load image, restart, migrate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            set -o pipefail
            cd /opt/commonpub
            # Keep the running image as :previous for a one-retag rollback.
            docker tag heatsynclabs-app:latest heatsynclabs-app:previous 2>/dev/null || true
            docker load < heatsynclabs-app.tar.gz
            rm -f heatsynclabs-app.tar.gz
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            # Wait for the app container to be up before pushing schema
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml ps app | grep -q "Up"; then break; fi
              sleep 3
            done
            # Apply committed schema migrations via drizzle migrate (db-migrate.mjs).
            # Replaces `db:push --force`, which aborts non-interactively on
            # drizzle-kit's truncate prompt (no TTY) and silently applied nothing.
            # NO `| tee` — that masked the exit code. Migrations ship in the image
            # under node_modules/@commonpub/schema/migrations; state is baselined in
            # drizzle.__drizzle_migrations.
            docker compose -f docker-compose.prod.yml exec -T \
              -e DRIZZLE_MIGRATIONS_FOLDER=node_modules/@commonpub/schema/migrations \
              app node scripts/db-migrate.mjs \
              || { echo "::error::db:migrate failed"; exit 1; }
            docker image prune -f
            # Post-deploy smoke, run INSIDE the app container. The old loop could
            # only warn, so a broken release still reported success. This waits for
            # /api/health, then requires /, /api/health and /contests to answer.
            docker compose -f docker-compose.prod.yml exec -T app node scripts/smoke.mjs \
              || { echo "::error::Post-deploy smoke failed. Roll back: docker tag heatsynclabs-app:previous heatsynclabs-app:latest && docker compose -f docker-compose.prod.yml up -d --force-recreate app"; exit 1; }
            # Bring the live Caddyfile up to the repo's version when it is safe to.
            sh caddy-sync/sync-caddyfile.sh caddy-sync/Caddyfile caddy-sync/caddyfile-known.sha256 -f docker-compose.prod.yml \
              || echo "::warning::Caddyfile sync errored; the app deploy itself succeeded."
            echo "Deployed ${{ github.sha }}"
